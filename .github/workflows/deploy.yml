name: Deploy to ECS

on:
  push:
    branches: ["web-beta"]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Build and validate before anything is copied to the server.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build static site
        run: npm run check

      - name: Validate static export
        run: npm run validate:export

      - name: Prepare ECS release directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22222
          script: |
            set -eu
            mkdir -p "/var/www/web-beta/releases/${{ github.sha }}"

      - name: Deploy to ECS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22222
          source: "out/**"
          target: "/var/www/web-beta/releases/${{ github.sha }}"
          strip_components: 1

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22222
          script: |
            # Activate by symlink so the server never serves a partially copied release.
            set -eu
            base=/var/www/web-beta
            release="$base/releases/${{ github.sha }}"
            test -f "$release/index.html"
            ln -sfn "$release" "$base/current.new"
            mv -Tf "$base/current.new" "$base/current"
            find "$base/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf